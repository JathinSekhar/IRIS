# Render blueprint for the IRIS online demo (the sandbox; see Dockerfile). Free plan: it sleeps after ~15 minutes idle, and every wake-up
# starts with a clean demo database (only the reviewer and the doctor exist).
services:
  - type: web
    name: iris-demo
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: IRIS_DEMO_PASSWORD        # the access password reviewers type on the first page. Set it in the Render dashboard.
        sync: false
      - key: IRIS_GROQ_API_KEY         # the AI reply; set it in the Render dashboard, never in the repository
        sync: false
      - key: IRIS_LLM_ENABLED
        value: "true"
      - key: IRIS_COOKIE_SECURE        # Render serves HTTPS
        value: "true"
